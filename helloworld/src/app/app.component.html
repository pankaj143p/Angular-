<div>
  <img [src]="imgUrl" (click)="onClick($event)" alt="bridgelabz logo"/>
  <h1>{{this.title}}</h1>
  <h1>Hello {{this.name}} form bridgelabz !</h1>
</div>
<div>
  <input [(ngModel)]="name" (input)="onInput()" type="text" placeholder="Enter your name">
  <div class=name-error>
  <span >{{this.nameError}}</span>
</div>
</div>
<router-outlet></router-outlet>
